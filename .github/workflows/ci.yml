name: artifact-pose-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      # Exact versions the CITA results were produced with (Linux and Windows verified).
      - run: pip install -r requirements-lock.txt
      - name: Library versions (compare when numbers drift across platforms)
        run: python -c "import platform, cv2, numpy, scipy, skimage; print('python', platform.python_version(), platform.platform()); print('opencv', cv2.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'skimage', skimage.__version__)"
      - run: python -m compileall -q app ../embed ../ai_module
      - run: pytest -q --ignore=tests/cita
      - name: CITA experiment tests
        run: pytest tests/cita -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose interpolation
        working-directory: server
        run: docker compose --env-file env.docker.example -f docker-compose.yml config --quiet
