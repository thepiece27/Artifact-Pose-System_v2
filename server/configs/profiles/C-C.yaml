name: C-C
extends: M3
description: "Pose M3 + self-calibrating Jacobian controller (I3)"
control:
  controller: jacobian
  max_iterations: 10
  tol_translation_mm: 10.0   # placeholder: team fixes tau after E0.4/E3 (same value in all C-* files)
  tol_rotation_deg: 1.0
  probe: {scheme: chained_forward, delta: {x_mm: 5, z_mm: 5, yaw_deg: 2, pitch_deg: 2}, ttl_s: 3600}
  gain: 0.8
  broyden: {enabled: false, beta: 0.5}
  stop: {uncertainty_aware: false, k_sigma: 2.0}
motion_profile: {}
